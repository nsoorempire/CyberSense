services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cybersense
      POSTGRES_PASSWORD: cybersense
      POSTGRES_DB: cybersense
    ports:
      - "5432:5432"
    volumes:
      - cybersense_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersense -d cybersense"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  cybersense_pg:
